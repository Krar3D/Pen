<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ضربات الجزاء - معلومات عامة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        :root {
            --team-color: #00aaff;
            --team-glow: rgba(0, 200, 255, 0.3);
            --text-on-team: #ffffff;
            --net-color: rgba(255,255,255,0.2);
            --goal-border: #ffffff;
            --pitch-color-1: #1a662c;
            --pitch-color-2: #165624;
        }

        * { box-sizing: border-box; }

        html, body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; margin: 0; padding: 0;
            background: linear-gradient(to bottom, #06111f 0%, #0a2342 40%, var(--pitch-color-1) 40%, var(--pitch-color-2) 100%);
            color: white; font-family: 'Tajawal', sans-serif;
            overflow: hidden; overscroll-behavior: none; touch-action: none;
        }

        /* تأثير اهتزاز الشاشة للعارضة */
        .shake-screen { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        /* تصميم البطاقات المرفوعة */
        .card-overlay {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0) rotate(-10deg);
            width: 120px; height: 170px; border-radius: 12px; z-index: 2000; pointer-events: none;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
            font-size: 4rem; opacity: 0; transition: all 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        .card-overlay.show-card { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        .bg-yellow { background: linear-gradient(135deg, #ffd700, #ffb300); border: 3px solid #ffcc00; }
        .bg-red { background: linear-gradient(135deg, #ff3232, #d50000); border: 3px solid #cc0000; }

        /* ------------------ بيئة الملعب (Stadium) ------------------ */
        .stadium {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            perspective: 800px;
        }

        .pitch-lines {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) rotateX(60deg);
            width: 300px; height: 400px; border: 3px solid rgba(255,255,255,0.6);
            border-bottom: none; border-radius: 10px 10px 0 0; z-index: 1; pointer-events: none;
        }
        .penalty-arc {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 50px; border: 3px solid rgba(255,255,255,0.6);
            border-bottom: none; border-radius: 50px 50px 0 0;
        }

        .goal-post {
            position: absolute; bottom: 35%; left: 50%; transform: translateX(-50%);
            width: 250px; height: 120px;
            border-top: 8px solid var(--goal-border); 
            border-left: 8px solid var(--goal-border); 
            border-right: 8px solid var(--goal-border);
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, var(--net-color) 10px, var(--net-color) 12px),
                        repeating-linear-gradient(-45deg, transparent, transparent 10px, var(--net-color) 10px, var(--net-color) 12px);
            z-index: 2; box-shadow: inset 0 20px 50px rgba(0,0,0,0.5);
            transition: all 0.5s;
        }

        .goalkeeper {
            position: absolute; bottom: 38%; left: 50%; transform: translateX(-50%);
            font-size: 4.5rem; z-index: 3; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            animation: gkIdle 2s infinite alternate ease-in-out;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.4));
        }
        @keyframes gkIdle { 0% { margin-left: -20px; } 100% { margin-left: 20px; } }
        
        .gk-dive-left { animation: none !important; transform: translateX(-120px) rotate(-45deg) scale(1.1); bottom: 40%; }
        .gk-dive-right { animation: none !important; transform: translateX(80px) rotate(45deg) scale(1.1); bottom: 40%; }
        .gk-save { animation: none !important; transform: translateX(-50%) scale(1.3); bottom: 42%; }

        .ball {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            font-size: 3rem; z-index: 10; transition: all 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.6));
        }

        /* تأثير الطوبة النارية */
        .ball.fireball {
            filter: drop-shadow(0 0 15px #ff4500) drop-shadow(0 0 30px #ff0000);
            transition: all 0.25s cubic-bezier(0.17, 0.89, 0.32, 1.28) !important;
            animation: fireShake 0.2s infinite;
        }
        @keyframes fireShake {
            0% { transform: translateX(-50%) scale(1) rotate(0deg); }
            50% { transform: translateX(-50%) scale(1.05) rotate(5deg); }
            100% { transform: translateX(-50%) scale(1) rotate(-5deg); }
        }

        .kick-goal-left { bottom: 45%; transform: translateX(-100px) scale(0.4) rotate(720deg) !important; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        .kick-goal-right { bottom: 45%; transform: translateX(50px) scale(0.4) rotate(720deg) !important; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        .kick-miss { bottom: 40%; transform: translateX(-50%) scale(0.6) rotate(360deg) !important; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        
        .kick-crossbar { bottom: 58% !important; transform: translateX(-80px) scale(0.35) rotate(1000deg) !important; filter: drop-shadow(0 15px 5px rgba(0,0,0,0.5)); }

        .goal-text {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, 20px) scale(0);
            font-size: 4rem; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff3232, 0 0 40px #ff9d00;
            z-index: 20; opacity: 0; transition: all 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        .goal-text.show { transform: translate(-50%, 0) scale(1); opacity: 1; }

        /* ------------------ الواجهة العلوية (HUD) ------------------ */
        .top-hud {
            position: fixed; top: 35px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; z-index: 1000; pointer-events: none;
        }
        .streak-hud {
            background: linear-gradient(45deg, #ff4500, #ff8c00); color: white;
            padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;
            box-shadow: 0 3px 10px rgba(255, 69, 0, 0.4); display: none;
            border: 1px solid #fffacd; animation: popIn 0.4s ease-out;
        }
        .highscore-hud {
            background: rgba(255, 215, 0, 0.15); color: #ffd700;
            padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;
            border: 1px solid rgba(255, 215, 0, 0.5); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ------------------ واجهة المستخدم (UI) ------------------ */
        .ui-layer {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(15, 20, 35, 0.98); border-top: 2px solid var(--team-glow);
            padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
            border-radius: 25px 25px 0 0; width: 100%; max-width: 600px; text-align: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
            max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
            transition: border-color 0.5s;
        }

        #team-screen h2 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
        #quiz-content { display: none; }

        .ui-layer::-webkit-scrollbar { width: 5px; } .ui-layer::-webkit-scrollbar-thumb { background: var(--team-color); border-radius: 5px; }

        .top-tools { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .q-counter { font-size: 0.95rem; color: var(--text-on-team); font-weight: bold; margin: 0; background: var(--team-color); padding: 4px 15px; border-radius: 12px; transition: all 0.5s; }

        .timer-container { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 15px; }
        .timer-bar { height: 100%; width: 100%; background: var(--team-color); transition: width 1s linear, background 0.5s; }
        .timer-warning { background: #ff3232 !important; }

        h2 { margin: 0 0 15px 0; color: #fff; font-size: 1.1rem; line-height: 1.5; }
        
        .options { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        button.opt-btn { background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid var(--team-glow); padding: 12px 10px; border-radius: 12px; font-size: 0.95rem; font-family: 'Tajawal', sans-serif; cursor: pointer; transition: all 0.2s; text-align: center; font-weight: bold;}
        button.opt-btn:hover { background: rgba(255, 255, 255, 0.1); }
        button.opt-btn:disabled { opacity: 0.9; cursor: default; }
        
        .team-btn { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; padding: 15px; border-width: 2px; }

        .speech-bubble { background: white; color: black; padding: 6px 12px; border-radius: 12px; font-size: 1rem; font-weight: 900; margin-bottom: 15px; display: none; opacity: 0; transition: opacity 0.3s; }

        #explanation-box { display: none; margin-top: 15px; background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); animation: fadeIn 0.4s; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #explanation-box h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        #explanation-box p { margin: 0 0 15px 0; font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; }

        #next-btn { background: var(--team-color); color: var(--text-on-team); font-weight: 900; width: 100%; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 1.1rem; transition: all 0.5s; text-shadow: 0 1px 2px rgba(0,0,0,0.3);}

        #completion-screen { display: none; animation: fadeIn 0.8s; }
        .trophy { font-size: 4rem; margin: 0; filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));}
        .score-text { font-size: 2.5rem; margin: 10px 0; font-weight: 900; }
        #final-desc { font-size: 1rem; color: #aaa; margin-bottom: 20px; line-height: 1.5; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .action-btns button { flex: 1; border: none; font-weight: bold; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 1rem;}
        .btn-restart { background: #fff; color: #000;}
        .btn-review { background: var(--team-color); color: var(--text-on-team) !important;}

        #review-screen { display: none; text-align: right; }
        .review-item { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .review-q { font-weight: bold; color: #fff; margin-bottom: 10px; font-size: 1rem; line-height: 1.4; }
        .review-ans { font-size: 0.95rem; margin-bottom: 8px; }
        .review-ans span { font-weight: bold; padding: 3px 8px; border-radius: 5px; }
        .ans-correct { background: rgba(0, 255, 150, 0.2); color: #00ff9d; }
        .ans-wrong { background: rgba(255, 50, 50, 0.2); color: #ff3232; }
        .review-exp { font-size: 0.9rem; color: #aaa; margin-top: 10px; border-top: 1px dashed #444; padding-top: 10px; }
        .close-review-btn { width: 100%; background: #ef4444; color: white; border: none; font-weight: bold; margin-top: 10px; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 1.1rem;}

        .confetti { position: fixed; width: 10px; height: 10px; background-color: #f00; z-index: 9999; animation: fall 3s linear forwards; pointer-events: none; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

    <!-- بطاقة الحكم -->
    <div class="card-overlay" id="ref-card"></div>

    <div class="top-hud">
        <div class="highscore-hud" id="highscore-badge">🏆 أعلى نقاط: 0</div>
        <div class="streak-hud" id="streak-badge">🔥 طوبة نارية (x2)</div>
    </div>

    <!-- الملعب -->
    <div class="stadium" id="stadium">
        <div class="goal-text" id="goal-text">GOAAAL! ⚽</div>
        <div class="goal-post"></div>
        <div class="goalkeeper" id="gk">🧤</div>
        <div class="pitch-lines">
            <div class="penalty-arc"></div>
        </div>
        <div class="ball" id="ball">⚽</div>
    </div>

    <!-- واجهة المستخدم -->
    <div class="ui-layer" id="ui-container">
        
        <!-- شاشة اختيار الفريق -->
        <div id="team-screen">
            <h2>اختار فريقك المفضل ⚽</h2>
            <div class="options">
                <button class="opt-btn team-btn" onclick="selectTeam('barca')" style="border-color: #a50044; background: rgba(165,0,68,0.1);">🔴🔵 برشلونة</button>
                <button class="opt-btn team-btn" onclick="selectTeam('real')" style="border-color: #ffffff; background: rgba(255,255,255,0.05);">⚪ ريال مدريد</button>
                <button class="opt-btn team-btn" onclick="selectTeam('liverpool')" style="border-color: #c8102E; background: rgba(200,16,46,0.1);">🔴 ليفربول</button>
            </div>
        </div>

        <div id="quiz-content">
            <div class="top-tools">
                <div class="q-counter" id="q-counter">الضربة 1 من 20</div>
            </div>
            
            <div class="timer-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>

            <h2 id="question-text">جاري التحميل...</h2>
            
            <div class="speech-bubble" id="speech-bubble"></div>

            <div class="options" id="options-container"></div>
            
            <div id="explanation-box">
                <h3 id="result-title"></h3>
                <p id="explanation-text"></p>
                <button id="next-btn" onclick="moveToNext()">الضربة القادمة ⚽</button>
            </div>
        </div>
        
        <div id="completion-screen">
            <div class="trophy" id="final-trophy">🏆</div>
            <h2 id="final-praise">جاري الحساب...</h2>
            <p id="final-desc">جاري التقييم...</p>
            
            <div class="score-text" id="final-score">النقاط: 0</div>
            
            <div class="action-btns">
                <button class="btn-review" onclick="showReview()">مراجعة 📋</button>
                <button class="btn-restart" onclick="location.reload()">تغيير الفريق 🔄</button>
            </div>
        </div>

        <div id="review-screen">
            <h2 style="text-align: center; color: #fff; margin-top: 0;">تفاصيل التسديدات</h2>
            <div id="review-list"></div>
            <button class="close-review-btn" onclick="location.reload()">إنهاء المباراة</button>
        </div>
    </div>

    <script>
        // ----------------- نظام الأصوات والاهتزاز -----------------
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); 
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') { 
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            } else if (type === 'wrong' || type === 'card') { 
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(300, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4); 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'crossbar') { 
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') { 
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        function triggerVibration(type) {
            if (!navigator.vibrate) return;
            if (type === 'click') navigator.vibrate(30); 
            else if (type === 'correct') navigator.vibrate([100, 50, 100]); 
            else if (type === 'wrong') navigator.vibrate(200); 
            else if (type === 'crossbar' || type === 'redcard') navigator.vibrate([300, 50, 300]); 
        }

        function showRefCard(type) {
            const cardObj = document.getElementById('ref-card');
            cardObj.className = 'card-overlay show-card ' + (type === 'yellow' ? 'bg-yellow' : 'bg-red');
            cardObj.innerText = type === 'yellow' ? '🟨' : '🟥';
            playSound('card');
            setTimeout(() => { cardObj.classList.remove('show-card'); }, 2000);
        }

        // الأسئلة الـ 20 
        let quizData = [
            { q: '1. ما هو تعريف الجريمة من وجهة نظر "علم الاجتماع" كما ورد في النص؟', options: ['أ) كل فعل يعاقب عليه القانون.', 'ب) أفعال وسلوكيات تتعارض مع المصلحة العامة للجماعة.', 'ج) صراعات نفسية تحدثها مكبوتات اللاشعور.', 'د) ارتكاب كل فعل نهى الله عنه.'], correct: 1, explanation: "حسب المنهج، علم الاجتماع يركز على السلوكيات التي تتعارض مع مصلحة الجماعة." },
            { q: '2. الجرائم التي تهدف إلى النيل من "السلم والأمن الوطني والدولي" وتتضمن الإبادة الجماعية تسمى:', options: ['أ) جرائم سياسية.', 'ب) جرائم اجتماعية.', 'ج) جرائم دولية.', 'د) جرائم السلطة والحكومة.'], correct: 2, explanation: "الإبادة الجماعية تعتبر من أبشع الجرائم الدولية." },
            { q: '3. "جريمة مصادرة الأموال" التي ارتكبها النظام السابق تُعرف بأنها انتزاع الأموال من أصحابها بـ:', options: ['أ) التراضي القانوني.', 'ب) القوة دون وجه حق.', 'ج) مقابل تعويض عادل.', 'د) بسبب مخالفات مرورية.'], correct: 1, explanation: "المصادرة كانت تتم بالقوة والإكراه دون أي حق قانوني." },
            { q: '4. وفقاً للمادة (11) من قانون المحكمة الجنائية العراقية العليا، تشمل "جريمة الإبادة الجماعية" الأفعال المرتكبة بقصد إهلاك جماعة:', options: ['أ) قومية أو أثنية أو عرقية أو دينية.', 'ب) سياسية فقط.', 'ج) اقتصادية فقط.', 'د) رياضية.'], correct: 0, explanation: "الإبادة تستهدف تدمير جماعات على أساس قومي أو عرقي أو ديني." },
            { q: '5. أي من الأفعال التالية يُصنف ضمن "الجرائم ضد الإنسانية" إذا ارتكب في إطار هجوم واسع النطاق؟', options: ['أ) القتل العمد.', 'ب) الاسترقاق.', 'ج) التعذيب.', 'د) جميع ما ذكر.'], correct: 3, explanation: "جميع هذه الأفعال تصنف كجرائم ضد الإنسانية إذا كانت واسعة النطاق وممنهجة." },
            { q: '6. جريمة "التهجير القسري" تعني إجبار الأفراد على مغادرة أماكن إقامتهم دون موافقتهم، وهي تُعد انتهاكاً لـ:', options: ['أ) قانون المرور.', 'ب) حقوق الإنسان والكرامة الإنسانية.', 'ج) الأنظمة النقابية.', 'د) القواعد المالية.'], correct: 1, explanation: "التهجير القسري هو انتهاك صارخ لحقوق الإنسان الأساسية." },
            { q: '7. في أي عام حدثت جريمة "إعدام عدد من التجار العراقيين" بذريعة احتكار الأسعار؟', options: ['أ) 1980م.', 'ب) 1988م.', 'ج) 1992م.', 'د) 2003م.'], correct: 2, explanation: "وقعت هذه الجريمة في عام 1992 حيث تم إعدام عدد من التجار." },
            { q: '8. "جريمة الدجيل" (عام 1982) استهدفت أهالي المنطقة بعد محاولة اغتيال رئيس النظام، وتضمنت:', options: ['أ) إعدام أكثر من 148 شخصاً.', 'ب) تجريف أكثر من 250 ألف دونم من البساتين.', 'ج) اعتقالات تعسفية للنساء والأطفال.', 'د) جميع ما ذكر.'], correct: 3, explanation: "النظام قام بكل هذه الانتهاكات (إعدامات، تجريف، اعتقالات) رداً على محاولة الاغتيال." },
            { q: '9. ما هو نوع السلاح المستخدم في جريمة "قصف مدينة حلبجة" عام 1988؟', options: ['أ) الأسلحة التقليدية فقط.', 'ب) السلاح الكيمياوي (غاز الخردل وغاز السارين).', 'ج) الأسلحة النووية.', 'د) لم يتم استخدام أي سلاح.'], correct: 1, explanation: "استخدم النظام غازات كيميائية سامة ومحرمة دولياً لقصف حلبجة." },
            { q: '10. تأسست المحكمة الجنائية العراقية العليا بموجب القانون رقم (10) لسنة:', options: ['أ) 2003.', 'ب) 2004.', 'ج) 2005.', 'د) 2006.'], correct: 2, explanation: "تم تأسيس المحكمة بقانون رقم 10 في عام 2005 لمحاكمة رموز النظام السابق." },
            { q: '11. ما هو الهدف الأساسي من "المستوى التشريعي" في حماية حقوق الإنسان كما ورد في النص؟', options: ['أ) تنفيذ السياسات الميدانية.', 'ب) تعزيز أدوات الضمانة الدستورية لتحقيق التوازن بين مصلحة الفرد والمجتمع.', 'ج) إصدار الأحكام القضائية النهائية.', 'د) مراقبة السجون والمعتقلات.'], correct: 1, explanation: "التشريع يهدف لوضع ضمانات دستورية توازن بين حقوق الفرد والمجتمع." },
            { q: '12. أي مما يلي يُعد من الحقوق المدنية والسياسية التي يجب تجريم المساس بها وفقاً للمستوى التشريعي؟', options: ['أ) الحق في التعليم.', 'ب) الحق في العمل.', 'ج) الحق في الحياة وسلامة الجسد.', 'د) حقوق البيئة والتنمية.'], correct: 2, explanation: "الحق في الحياة هو من أهم الحقوق المدنية الأساسية." },
            { q: '13. يرتكز "المستوى التنفيذي" على عدة مبادئ أساسية، أي من المبادئ التالية ذُكر في النص؟', options: ['أ) مبدأ تغليب مصلحة الدولة على القانون.', 'ب) مبدأ شرعية الجرائم والعقوبات.', 'ج) مبدأ العقاب الجماعي.', 'د) مبدأ سرية المحاكمات.'], correct: 1, explanation: "لا جريمة ولا عقوبة إلا بنص (مبدأ الشرعية)." },
            { q: '14. متى يجوز تطبيق قانون العقوبات بـ "أثر رجعي" حسب المبادئ المذكورة؟', options: ['أ) في جميع القضايا السياسية.', 'ب) إذا كان ذلك في مصلحة المجتمع.', 'ج) إذا كان القانون الجديد أصلح للمتهم.', 'د) لا يجوز تطبيقه بأثر رجعي نهائياً.'], correct: 2, explanation: "القاعدة العامة عدم الرجعية، إلا إذا كان القانون الجديد أصلح وأخف للمتهم." },
            { q: '15. في أي عام وقعت جريمة أحداث صلاة الجمعة التي أعقبت اغتيال السيد محمد صادق الصدر؟', options: ['أ) 1991م.', 'ب) 2003م.', 'ج) 1999م.', 'د) 1980م.'], correct: 2, explanation: "وقعت أحداث صلاة الجمعة الدامية في عام 1999." },
            { q: '16. في أي محافظة اندلع الحراك الجماهيري رداً على جريمة اغتيال السيد المرجع؟', options: ['أ) البصرة وبغداد.', 'ب) السليمانية وأربيل.', 'ج) نينوى وصلاح الدين.', 'د) الأنبار وديالى.'], correct: 0, explanation: "الانتفاضة والحراك اندلع في محافظات الوسط والجنوب وبغداد." },
            { q: '17. ما هو الإجراء الذي اتخذه نظام البعث ضد المصلين في جامع المحسن وجامع الحكمة؟', options: ['أ) فرض غرامات مالية.', 'ب) اعتقال العشرات من المواطنين.', 'ج) منع الصلاة ليوم واحد فقط.', 'د) تهجيرهم خارج البلاد.'], correct: 1, explanation: "النظام قام بحملة اعتقالات واسعة للمصلين." },
            { q: '18. من هما المجرمان اللذان صدر بحقهما حكم بـ "الإعدام" في قضية أحداث صلاة الجمعة وفقاً للنص؟', options: ['أ) لطيف نصيف جاسم ومحمد زمام.', 'ب) علي حسن المجيد ومحمود فيزي محمد.', 'ج) عزيز صالح حسن ومحمد زمام.', 'د) صدام حسين وطه ياسين رمضان.'], correct: 1, explanation: "حسب المادة، علي حسن المجيد ومحمود فيزي محمد هما من حُكم عليهما بالإعدام." },
            { q: '19. أي من المستويات التالية يُعتبر "الضمانة الدستورية" لتحقيق التوازن بين مصلحة الفرد والمصلحة العامة؟', options: ['أ) المستوى التنفيذي.', 'ب) المستوى التشريعي.', 'ج) المستوى العسكري.', 'د) المستوى الإعلامي.'], correct: 1, explanation: "المستوى التشريعي هو الذي يضع القوانين والضمانات الدستورية." },
            { q: '20. ما هو المبدأ الذي ينص على عدم جواز تطبيق العقوبة إلا إذا كان القانون الجديد "أصلح للمتهم"؟', options: ['أ) مبدأ شرعية الجرائم.', 'ب) مبدأ عدم رجعية قانون العقوبات الا اذا كان اصلح للمتهم.', 'ج) مبدأ ان الاصل في المتهم البراءة.', 'د) مبدأ شخصية العقوبة.'], correct: 1, explanation: "هذا المبدأ يحمي المتهم من تطبيق قوانين جديدة أشد عليه بعد ارتكاب الفعل." }
        ];

        const happyReplies = ["عالللللمي! ⚽", "بالمقص! 🔥", "عاش الشويت! 🤩", "هدف خرافي! 🥅", "ولا يگدرلها الحارس! ✨"];
        const speedReplies = ["صاروخية! 🚀", "شوتة عالطاير! ⚡", "سريع ومطير! 🌪️", "شوتة لا تصد ولا ترد! 💥"];
        const sadReplies = ["بالعارضة! 🤦‍♂️", "صدها الحارس! 🧤", "شوتة ضعيفة! 🧐", "ضيعتها! 💔"];

        let currentQ = 0; let score = 0; let streak = 0; let userAnswers = [];
        let timeLeft = 25; let maxTime = 25; let timerInterval; 
        let isFireball = false;
        let hasYellowCard = false; // متغير لتتبع البطاقات

        let highScore = localStorage.getItem('penaltyQuizPoints20') || 0;
        document.getElementById('highscore-badge').innerText = `🏆 أعلى نقاط: ${highScore}`;

        const gk = document.getElementById('gk');
        const ball = document.getElementById('ball');
        const goalText = document.getElementById('goal-text');
        const bubble = document.getElementById('speech-bubble'); const streakBadge = document.getElementById('streak-badge');
        const qText = document.getElementById('question-text'); const optsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box'); const resTitle = document.getElementById('result-title');
        const expText = document.getElementById('explanation-text'); const nextBtn = document.getElementById('next-btn');
        const timerBar = document.getElementById('timer-bar'); const uiContainer = document.getElementById('ui-container');

        function selectTeam(team) {
            initAudio(); 
            triggerVibration('click');
            playSound('click');

            let root = document.documentElement;
            if (team === 'barca') {
                root.style.setProperty('--team-color', '#004d98'); 
                root.style.setProperty('--team-glow', 'rgba(165, 0, 68, 0.8)'); 
                root.style.setProperty('--text-on-team', '#ffffff');
                root.style.setProperty('--net-color', 'rgba(165, 0, 68, 0.5)'); 
                root.style.setProperty('--goal-border', '#a50044'); 
            } else if (team === 'real') {
                root.style.setProperty('--team-color', '#ffffff'); 
                root.style.setProperty('--team-glow', 'rgba(255, 255, 255, 0.7)');
                root.style.setProperty('--text-on-team', '#000000'); 
                root.style.setProperty('--net-color', 'rgba(255, 255, 255, 0.5)'); 
                root.style.setProperty('--goal-border', '#ffffff'); 
            } else if (team === 'liverpool') {
                root.style.setProperty('--team-color', '#c8102E'); 
                root.style.setProperty('--team-glow', 'rgba(200, 16, 46, 0.7)');
                root.style.setProperty('--text-on-team', '#ffffff');
                root.style.setProperty('--net-color', 'rgba(200, 16, 46, 0.6)'); 
                root.style.setProperty('--goal-border', '#ffffff'); 
            }
            
            document.getElementById('team-screen').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            loadQ();
        }

        function startTimer() {
            timeLeft = maxTime;
            timerBar.style.width = '100%'; timerBar.classList.remove('timer-warning');
            clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeLeft--; timerBar.style.width = `${(timeLeft / maxTime) * 100}%`;
                if (timeLeft === 5) { timerBar.classList.add('timer-warning'); }
                if (timeLeft <= 0) { clearInterval(timerInterval); checkAns(-1, null); }
            }, 1000);
        }

        function loadQ() {
            if (currentQ >= quizData.length) return;
            
            document.body.classList.remove('shake-screen');
            void document.body.offsetWidth; 

            if (streak >= 2) {
                ball.className = 'ball fireball';
                isFireball = true;
            } else {
                ball.className = 'ball';
                isFireball = false;
            }
            
            gk.className = 'goalkeeper'; goalText.classList.remove('show');

            const current = quizData[currentQ];
            document.getElementById('q-counter').innerText = `الضربة ${currentQ + 1} من ${quizData.length}`;
            qText.innerText = current.q; 
            
            optsContainer.innerHTML = '';
            expBox.style.display = 'none'; bubble.style.display = 'none'; bubble.style.opacity = '0';
            
            let btnText = (currentQ === quizData.length - 1) ? "صافرة النهاية 🏁" : "الضربة القادمة ⚽";
            if (isFireball) btnText += " (النقاط x2 🔥)";
            nextBtn.innerText = btnText;

            current.options.forEach((opt, idx) => {
                let btn = document.createElement('button'); btn.className = 'opt-btn'; btn.innerText = opt;
                btn.onclick = () => { 
                    triggerVibration('click');
                    playSound('click');
                    checkAns(idx, btn); 
                };
                optsContainer.appendChild(btn);
            });
            startTimer(); uiContainer.scrollTop = 0;
        }

        function checkAns(idx, btn) {
            clearInterval(timerInterval);
            
            const timeTaken = maxTime - timeLeft; 
            const isSpeedKick = (timeTaken <= 5 && idx !== -1); 

            const current = quizData[currentQ]; const btns = optsContainer.querySelectorAll('button');
            const isCorrect = (idx === current.correct); const isTimeout = (idx === -1);
            
            let pointsGained = 0;
            let penaltyPoints = 0;

            if (isCorrect) {
                pointsGained = 1; 
                if (isFireball) pointsGained += 1; 
                if (isSpeedKick) pointsGained += 1; 
                score += pointsGained;
            } else if (isTimeout) {
                // نظام البطاقات
                if (!hasYellowCard) {
                    hasYellowCard = true; // انطرد باجر
                    showRefCard('yellow');
                    triggerVibration('wrong');
                } else {
                    hasYellowCard = false; // تصفير حتى يرجع يحسب من جديد
                    showRefCard('red');
                    triggerVibration('redcard');
                    penaltyPoints = 2;
                    score -= penaltyPoints;
                    if (score < 0) score = 0; // حتى ما يصير الرصيد بالسالب
                    setTimeout(() => document.body.classList.add('shake-screen'), 200); // الشاشة تهتز للطرد
                }
            }

            userAnswers.push({
                question: current.q, 
                userPicked: isTimeout ? "انتهى الوقت" : current.options[idx],
                correctAnswer: current.options[current.correct], 
                isCorrect: isCorrect, 
                explanation: current.explanation,
                points: isCorrect ? pointsGained : (penaltyPoints > 0 ? -penaltyPoints : 0)
            });
            
            btns.forEach(b => b.disabled = true);
            btns[current.correct].style.background = 'rgba(0, 255, 150, 0.4)'; btns[current.correct].style.borderColor = '#00ff9d';

            bubble.style.display = 'block'; setTimeout(() => bubble.style.opacity = '1', 10);

            if (isCorrect) {
                triggerVibration('correct');
                playSound('correct');

                let side = Math.random() > 0.5 ? 'kick-goal-left' : 'kick-goal-right';
                ball.classList.add(side);
                gk.classList.add(side === 'kick-goal-left' ? 'gk-dive-right' : 'gk-dive-left'); 
                setTimeout(() => goalText.classList.add('show'), 300);

                if (isSpeedKick) {
                    resTitle.innerText = `✅ شوتة عالطاير! (+${pointsGained})`;
                    resTitle.style.color = "#00ffff"; 
                    bubble.innerText = speedReplies[Math.floor(Math.random() * speedReplies.length)];
                } else if (isFireball) {
                    resTitle.innerText = `✅ هدف ناري! (+${pointsGained})`;
                    resTitle.style.color = "#ff8c00";
                    bubble.innerText = "احترقت الشباك! 🔥";
                } else {
                    resTitle.innerText = `✅ إجابة صحيحة (+${pointsGained})`;
                    resTitle.style.color = "#00ff9d";
                    bubble.innerText = happyReplies[Math.floor(Math.random() * happyReplies.length)];
                }
                
                bubble.style.color = "#059669";
                streak++; 
                if (streak >= 2) { streakBadge.style.display = 'block'; }
            } else {
                streak = 0; streakBadge.style.display = 'none';
                ball.classList.add('kick-miss');
                gk.classList.add('gk-save');

                if (isTimeout) { 
                    if (penaltyPoints > 0) {
                        resTitle.innerText = "🟥 كارت أحمر! (-2 نقطة)";
                        resTitle.style.color = "#ff3232";
                        bubble.innerText = "انطردت بسبب تضييع الوقت! 🟥";
                        bubble.style.color = "#cc0000";
                    } else {
                        resTitle.innerText = "🟨 كارت أصفر!";
                        resTitle.style.color = "#ffd700";
                        bubble.innerText = "تأخرت! الحكم انطاك إنذار 🟨";
                        bubble.style.color = "#b8860b";
                    }
                } else { 
                    // تأثير العارضة (نسبة 50% تضرب بالعارضة)
                    let isCrossbar = Math.random() >= 0.5;
                    if (isCrossbar) {
                        triggerVibration('crossbar');
                        playSound('crossbar');
                        ball.className = 'ball fireball kick-crossbar'; // استخدمت كلاس الفايربول حتى يحافظ عالتصميم ويضيف انيميشن العارضة
                        setTimeout(() => document.body.classList.add('shake-screen'), 300); 
                        bubble.innerText = "بالعاااارضة! قهر 💔";
                    } else {
                        triggerVibration('wrong');
                        playSound('wrong');
                        bubble.innerText = sadReplies[Math.floor(Math.random() * sadReplies.length)];
                    }
                    resTitle.innerText = "❌ إجابة خاطئة!"; 
                    resTitle.style.color = "#ff3232"; 
                    bubble.style.color = "#dc2626";
                    btn.style.background = 'rgba(255, 50, 50, 0.4)'; 
                    btn.style.borderColor = '#ff3232'; 
                }
            }

            expText.innerText = current.explanation; expBox.style.display = 'block';
            setTimeout(() => { uiContainer.scrollTo({ top: uiContainer.scrollHeight, behavior: 'smooth' }); }, 100);
        }

        function moveToNext() {
            triggerVibration('click');
            playSound('click');
            currentQ++;
            if(currentQ < quizData.length) { loadQ(); } 
            else { showCompletion(); }
        }

        function shootConfetti() {
            const colors = ['#00ff9d', '#00aaff', '#ffd700', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                let conf = document.createElement('div'); conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw'; conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's'; conf.style.top = '-' + (Math.random() * 20 + 10) + 'px';
                document.body.appendChild(conf); setTimeout(() => conf.remove(), 4000);
            }
        }

        function showCompletion() {
            document.getElementById('quiz-content').style.display = 'none'; bubble.style.display = 'none'; streakBadge.style.display = 'none'; 
            
            if (score > highScore) { highScore = score; localStorage.setItem('penaltyQuizPoints20', highScore); document.getElementById('highscore-badge').innerText = `🏆 أعلى نقاط: ${highScore}`; }

            const praiseText = document.getElementById('final-praise'); const descText = document.getElementById('final-desc');
            const finalScoreObj = document.getElementById('final-score'); const trophy = document.getElementById('final-trophy');

            if (score >= 25) {
                praiseText.innerText = "أسطورة الملاعب! 🏆"; praiseText.style.color = "#00ff9d"; finalScoreObj.style.color = "#00ff9d";
                descText.innerText = "ختمت المادة لعب! جبت نقاط خرافية واستغليت الشوتات عالطاير!"; 
                trophy.innerText = "🥇"; shootConfetti(); playSound('correct');
            } else if (score >= 15) {
                praiseText.innerText = "بطل ومعدل! 👍"; praiseText.style.color = "#ffd700"; finalScoreObj.style.color = "#ffd700";
                descText.innerText = "أدائك حلو ومعلوماتك قوية، بس تكدر تجيب نقاط أكثر بالسرعة!"; 
                trophy.innerText = "🥈"; shootConfetti(); playSound('correct');
            } else {
                praiseText.innerText = "يرادلك دراسة أكثر! 💔"; praiseText.style.color = "#ff3232"; finalScoreObj.style.color = "#ff3232";
                descText.innerText = "العارضة والحارس تعبوك اليوم.. اقرأ المادة زين وارجع شوت!"; 
                trophy.innerText = "🧤"; playSound('wrong');
            }

            document.getElementById('final-score').innerText = `إجمالي النقاط: ${score}`; 
            document.getElementById('completion-screen').style.display = 'block'; uiContainer.scrollTop = 0;
        }

        function showReview() {
            triggerVibration('click'); playSound('click');
            document.getElementById('completion-screen').style.display = 'none';
            const reviewList = document.getElementById('review-list'); reviewList.innerHTML = ''; 

            userAnswers.forEach((ans, index) => {
                let div = document.createElement('div'); div.className = 'review-item';
                let ptsText = ans.points > 0 ? `+${ans.points}` : (ans.points < 0 ? ans.points : '0');
                let userStatus = ans.isCorrect ? `<span class="ans-correct">✅ ${ans.userPicked} (${ptsText})</span>` : `<span class="ans-wrong">❌ ${ans.userPicked} (${ptsText})</span> <br> (الصحيح: ${ans.correctAnswer})`;
                div.innerHTML = `<div class="review-q">س${index + 1}: ${ans.question}</div><div class="review-ans">إجابتك: ${userStatus}</div><div class="review-exp">💡 <b>توضيح:</b> ${ans.explanation}</div>`;
                reviewList.appendChild(div);
            });
            document.getElementById('review-screen').style.display = 'block'; uiContainer.scrollTop = 0;
        }

        streakBadge.style.display = 'none';
    </script>
</body>
</html>
